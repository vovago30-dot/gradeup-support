<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GradeUp — Підтримка</title>
<style>
  :root {
    --bg: #0F0F11;
    --accent: #39FF14;
    --card: #18181B;
    --text-secondary: #9CA3AF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(57, 255, 20, 0.25);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
  }
  .logo {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 3px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  h1 {
    font-size: 28px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), #17B80B);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 20px;
  }
  p {
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  a.email-btn {
    display: inline-block;
    background: var(--accent);
    color: #000000;
    font-weight: 800;
    font-size: 16px;
    text-decoration: none;
    padding: 16px 28px;
    border-radius: 14px;
    transition: opacity 0.2s;
  }
  a.email-btn:hover { opacity: 0.85; }
  .footer {
    margin-top: 32px;
    font-size: 12px;
    color: #4B5563;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">GRADEUP</div>
    <h1>Підтримка</h1>
    <p>
      Маєте питання, знайшли помилку або є пропозиція щодо застосунку GradeUp?
      Напишіть нам — відповідаємо якнайшвидше.
    </p>
    <a class="email-btn" href="mailto:support.gradeup@gmail.com">support.gradeup@gmail.com</a>
    <div class="footer">© 2026 GradeUp</div>
  </div>
</body>
</html>
